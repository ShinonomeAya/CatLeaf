.filter-area{margin:0 20px}.flat-row{display:flex;align-items:center;min-height:56px;gap:8px;border-bottom:1px solid var(--outline)}.unread-switch{display:flex!important;align-items:center;justify-content:space-between;gap:16px;flex:1;padding:0;text-align:left;min-width:0;font-size:calc(16px * var(--fs))}.track{width:46px;height:28px;background:var(--outline);border:2px solid var(--control);border-radius:18px;flex:none;display:flex;align-items:center;padding:2px}.thumb{width:18px;height:18px;background:var(--control);border-radius:50%}.unread-switch[aria-checked=true] .track{background:var(--primary);border-color:var(--primary);justify-content:flex-end}.unread-switch[aria-checked=true] .thumb{background:var(--bg)}.clear{flex:none;color:var(--primary)!important;padding:0 0 0 12px!important;font-size:calc(13px * var(--fs))}.result-note{font-size:calc(13px * var(--fs));line-height:1.55;color:var(--secondary);min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px}.result-note .clear{min-height:48px}.segments{display:flex;border:1px solid var(--control);border-radius:12px;overflow:hidden;margin-top:8px}.segment{flex:1;min-width:0;padding:8px 6px!important;font-size:calc(16px * var(--fs));line-height:1.5;display:flex;align-items:center;justify-content:center;gap:6px}.segment+.segment{border-left:1px solid var(--control)}.segment[aria-checked=true]{background:var(--accent)!important;color:var(--primary)!important;font-weight:600}.segment svg{width:18px;height:18px}.segment[aria-checked=false] svg{visibility:hidden}.compact-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}.compact-controls .date-chip{display:flex;align-items:center;gap:6px}.compact-controls .date-chip svg{margin:0}.compact-unread{display:flex;align-items:center;gap:6px;font-size:calc(16px * var(--fs));padding:0 12px!important;border:1px solid var(--control)!important;border-radius:12px}.compact-unread[aria-pressed=true]{background:var(--accent)!important;color:var(--primary)!important;border-color:transparent!important;font-weight:600}.compact-unread .selected-check{display:none}.compact-unread[aria-pressed=true] .selected-check{display:block}.list{margin-top:2px}.article{display:block!important;width:100%;text-align:left;padding:16px 20px!important;border-bottom:1px solid var(--outline)!important}.article-layout{display:flex;gap:12px;align-items:flex-start}.dot{width:7px;height:7px;flex:none;background:var(--primary);border-radius:50%;margin-top:9px}.read .dot{background:var(--control);opacity:.6}.article-title{font-size:calc(17px * var(--fs));font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.excerpt{color:var(--secondary);font-size:calc(13px * var(--fs));line-height:1.65;margin:5px 0}.article-meta{font-size:calc(13px * var(--fs));line-height:1.6;color:var(--secondary)}.empty{margin:32px 20px;text-align:center;line-height:1.6;color:var(--secondary)}.nav{height:78px;flex:none;display:flex;justify-content:space-around;background:var(--container);border-top:1px solid var(--outline);padding:5px 10px}.nav button{flex:1;font-size:calc(13px * var(--fs));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.nav .nav-active{color:var(--primary)}.nav-icon{display:flex;align-items:center;justify-content:center;width:56px;height:28px;border-radius:18px}.nav-active .nav-icon{background:var(--accent)}.gesture{height:18px;flex:none;background:var(--container);display:flex;justify-content:center;align-items:center}.gesture::after{content:"";width:90px;height:4px;border-radius:6px;background:var(--text)}.overlay{position:absolute;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:3}.sheet{width:100%;max-height:85%;overflow:auto;padding:12px 20px 24px;background:var(--container);border-radius:20px 20px 0 0}.sheet-head{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:calc(18 <body>
<main class="review">
<h1>阅读筛选，轻一点</h1>
<p class="intro">三个局部方案，保留猫页的阅读页与日期筛选。点击「仅未读」、日期和清除操作，比较手感；下方文章均为原型示例。</p>
<div class="controls" aria-label="原型预览设置">
<label>屏宽 <select id="width"><option value="360">360 dp</option><option value="411">411 dp</option></select></label>
<label>字号 <select id="font"><option value="1">1.0 倍</option><option value="1.3">1.3 倍</option></select></label>
<label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<label><input id="offline" type="checkbox">断网提示</label>
<label>查看 <select id="variant"><option value="all">并排比较</option><option value="A">A · 轻量开关</option><option value="B">B · 阅读状态</option><option value="C">C · 紧凑标签</option></select></label>
</div>
<div class="gallery" id="gallery"></div>
<p class="footer-note">A 改动最少；B 把“显示哪些文章”表达得最直接；C 为列表腾出更多首屏空间，日期选项需要展开。三案均保留日期 × 未读组合，清除同时恢复全部日期与全部文章。本页是 HTML 交互原型，不能替代 Android 实机验收。</p>
</main>
<template id="screen"><div class="phone"><div class="system"><span>15:50</span><span class="system-right" data-system></span></div><div class="screen-scroll"><header class="root"><div class="root-text"><div class="brand">CatLeaf</div><div class="root-title">阅读</div></div><div class="root-actions" data-actions></div></header><button class="source" data-source><span class="source-label">少数派</span><span data-chevron></span></button><div class="notice" hidden data-offline></div><p class="meta">本机使用 · 已保存 4 篇</p><section class="filters" aria-label="文章筛选"></section><div class="list"></div></div><nav class="nav" aria-label="底部导航"><button class="nav-active" data-nav="reading"><span class="nav-icon" data-icon="newspaper"></span>阅读</button><button data-nav="favorites"><span class="nav-icon" data-icon="bookmark"></span>收藏</button><button data-nav="settings"><span class="nav-icon" data-icon="settings"></span>设置</button></nav><div class="gesture"></div><div class="overlay" hidden></div></div></template>
<script>
const iconNames=['check','chevron-down','x','calendar-days','ellipsis','newspaper','bookmark','settings','wifi-off','arrow-left'];
// Search geometry reuses android-native/app/src/main/res/drawable/ic_search.xml.
const icons={search:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.3-4.3"/></svg>'};
const descriptions={A:['轻量开关','去掉卡片与重复说明，保留熟悉的开关。'],B:['阅读状态','全部文章 / 仅未读分段，状态更直接。'],C:['紧凑标签','日期和未读各一枚标签，留更多阅读空间。']};
const articles=[{title:'让信息回到阅读本身',excerpt:'从订阅开始，建立自己的阅读节奏。',time:'09:20',read:false,date:'today'},{title:'一个更安静的工作空间',excerpt:'减少干扰，让注意力回到眼前的内容。',time:'08:40',read:false,date:'today'},{title:'从纸页到屏幕，阅读习惯的小变化',excerpt:'换一种整理方式，给值得读的文字留个位置。',time:'10月8日',read:true,date:'older'},{title:'把想读的文章留到周末',excerpt:'收藏、归档和阅读，是三个不同的动作。',time:'时间未知',read:false,date:'unknown'}];
const states={A:{date:'all',unread:true,source:'少数派'},B:{date:'all',unread:true,source:'少数派'},C:{date:'all',unread:true,source:'少数派'}};
const dateLabel=s=>s.date==='on'?`${Number((s.dateValue||'2026-10-09').split('-')[1])}月${Number((s.dateValue||'2026-10-09').split('-')[2])}日`:({all:'全部日期',today:'今天',unknown:'未知日期'})[s.date];
function icon(name){return icons[name]||''}
function dateChips(s){return `<div class="date-chips" role="group" aria-label="日期筛选">${[['all','全部日期'],['today','今天'],['on','指定日期'],['unknown','未知日期']].map(([d,label])=>`<button class="date-chip" data-date="${d}" aria-pressed="${s.date===d}"><span class="selected-check">${icon('check')}</span>${d==='on'&&s.date==='on'?dateLabel(s):label}</button>`).join('')}</div>`}
function note(s){const rows=articles.filter(a=>(!s.unread||!a.read)&&(s.date==='all'||s.date==='unknown'&&a.date==='unknown'||s.date==='today'&&a.date==='today'||s.date==='on'&&(a.date==='today'&&(s.dateValue||'2026-10-09')==='2026-10-09'||a.date==='older'&&s.dateValue==='2026-10-08')));return{rows,text:`显示 ${rows.length} 篇`}}
function render(id){const p=document.querySelector(`#${id} .phone`),s=states[id],filtered=s.unread||s.date!=='all',n=note(s),clear=`<button class="clear" data-clear ${filtered?'':'hidden'}>清除筛选</button>`;
const active=document.activeElement,focusAttr=['data-unread','data-clear','data-date','data-read','data-pickdate'].find(a=>active?.hasAttribute(a)),focusSelector=active?.closest('.phone')===p&&focusAttr?`[${focusAttr}="${active.getAttribute(focusAttr)}"]`:null;
const filters=p.querySelector('.filters');
if(id==='A')filters.innerHTML=dateChips(s)+`<div class="filter-area"><div class="flat-row"><button class="unread-switch" role="switch" aria-checked="${s.unread}" data-unread><span>仅未读</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button>${clear}</div><div class="result-note">${n.text}</div></div>`;
if(id==='B')filters.innerHTML=dateChips(s)+`<div class="filter-area"><div class="segments" role="radiogroup" aria-label="阅读状态"><button class="segment" role="radio" aria-checked="${!s.unread}" data-read="all">${icon('check')}全部文章</button><button class="segment" role="radio" aria-checked="${s.unread}" data-read="unread">${icon('check')}仅未读</button></div><div class="result-note"><span>${n.text}</span>${clear}</div></div>`;
if(id==='C')filters.innerHTML=`<div class="filter-area"><div class="compact-controls"><button class="date-chip" data-pickdate aria-label="选择日期，当前${dateLabel(s)}">${dateLabel(s)}${icon('chevron-down')}</button><button class="compact-unread" data-unread aria-pressed="${s.unread}"><span class="selected-check">${icon('check')}</span>仅未读</button></div><div class="result-note"><span>${n.text}</span>${clear}</div></div>`;
p.querySelector('.list').innerHTML=n.rows.length?n.rows.map(a=>`<button class="article ${a.read?'read':''}" data-article="${articles.indexOf(a)}"><span class="article-layout"><span class="dot" aria-hidden="true"></span><span><span class="article-title">${a.title}</span><span class="excerpt" style="display:block">${a.excerpt}</span><span class="article-meta">${a.time} · ${a.read?'已读':'未读'}</span></span></span></button>`).join(''):`<div class="empty">这个日期没有符合条件的文章。<br>可以选择其他日期或清除筛选。</div>`;
p.querySelector('.source-label').textContent=s.source;
if(focusSelector){const target=p.querySelector(focusSelector);if(target&&!target.hidden)target.focus();else p.querySelector('[data-date=all],[data-pickdate]')?.focus()}
}
function closeSheet(p){p.querySelector('.overlay').hidden=true;const target=p._restoreFocus;if(target&&target.isConnected)target.focus()}
function sheet(p,title,content,origin){if(!origin?.closest('.overlay'))p._restoreFocus=origin||document.activeElement;const o=p.querySelector('.overlay');o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><span>${title}</span><button class="icon-button" data-close aria-label="关闭">${icon('x')}</button></div>${content}</div>`;o.hidden=false;o.querySelector('button').focus()}
function dateSheet(p,id,origin){sheet(p,'选择日期',`<div class="options" role="radiogroup" aria-label="日期选项">${[['all','全部日期'],['today','今天'],['on','指定日期'],['unknown','未知日期']].map(([d,label])=>`<button class="sheet-option" role="radio" aria-checked="${states[id].date===d}" data-sheet-date="${d}">${icon('check')}${label}</button>`).join('')}</div>`,origin)}
function syncPreview(){const w=document.querySelector('#width').value,fs=document.querySelector('#font').value,dark=document.querySelector('#theme').value==='dark',only=document.querySelector('#variant').value;document.documentElement.style.setProperty('--width',w+'px');document.documentElement.style.setProperty('--fs',fs);document.body.classList.toggle('single',only!=='all');document.querySelectorAll('.variant').forEach(v=>v.classList.toggle('chosen',v.id===only));document.querySelectorAll('.phone').forEach(p=>{p.classList.toggle('dark',dark);p.querySelector('[data-offline]').hidden=!document.querySelector('#offline').checked;p.querySelector('[data-offline]').innerHTML=icon('wifi-off')+'<span>无法连接，正在显示已保存内容</span>';p.querySelectorAll('[data-action="digest"],[data-action="search"]').forEach(b=>b.disabled=false)})}
document.querySelector('.controls').addEventListener('change',syncPreview);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.classList.contains('overlay'))closeSheet(e.target.closest('.phone'));return;}const p=b.closest('.phone');if(!p)return;const id=p.closest('.variant').id,s=states[id];if(b.hasAttribute('data-unread')){s.unread=!s.unread;render(id)}else if(b.dataset.read){s.unread=b.dataset.read==='unread';render(id)}else if(b.hasAttribute('data-clear')){s.unread=false;s.date='all';render(id)}else if(b.dataset.date){if(b.dataset.date==='on')sheet(p,'指定日期',`<p>原型示例日期，不触发真实数据请求。</p><input type="date" value="2026-10-09" aria-label="指定日期"><button class="sheet-option" data-confirm-date>确定日期</button>`,b);else{s.date=b.dataset.date;render(id)}}else if(b.hasAttribute('data-pickdate'))dateSheet(p,id,b);else if(b.dataset.sheetDate){if(b.dataset.sheetDate==='on')sheet(p,'指定日期',`<input type="date" value="2026-10-09" aria-label="指定日期"><button class="sheet-option" data-confirm-date>确定日期</button>`,b);else{s.date=b.dataset.sheetDate;closeSheet(p);render(id)}}else if(b.hasAttribute('data-confirm-date')){s.dateValue=p.querySelector('input[type=date]').value||'2026-10-09';s.date='on';closeSheet(p);render(id)}else if(b.hasAttribute('data-close'))closeSheet(p);else if(b.hasAttribute('data-source'))sheet(p,'选择订阅源',`<div class="options">${['少数派','爱范儿','一个名称很长的示例订阅源'].map(x=>`<button class="sheet-option" data-feed="${x}">${x}</button>`).join('')}</div><p>只演示来源选择布局，文章仍使用同一组原型示例。</p>`,b);else if(b.dataset.feed){s.source=b.dataset.feed;closeSheet(p);render(id)}else if(b.hasAttribute('data-article'))sheet(p,articles[Number(b.dataset.article)].title,'<p>这是阅读筛选局部原型。正式文章详情、已读和收藏逻辑保持原设计。</p>',b);else if(b.dataset.action||b.dataset.nav)sheet(p,({digest:'日摘要',search:'搜索文章',more:'更多',reading:'阅读',favorites:'收藏',settings:'设置'})[b.dataset.action||b.dataset.nav],'<p>本页只演示筛选布局与返回；此入口在 App 中沿用现有功能。</p>',b)});
document.addEventListener('keydown',e=>{const p=e.target.closest('.phone'),o=p?.querySelector('.overlay');if(!o||o.hidden)return;if(e.key==='Escape'){e.preventDefault();closeSheet(p)}if(e.key==='Tab'){const items=[...o.querySelectorAll('button,input')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
async function init(){for(const name of iconNames){const r=await fetch('../../assets/ui/'+name+'.svg');if(!r.ok)throw Error('缺少图标 '+name);const d=new DOMParser().parseFromString(await r.text(),'image/svg+xml'),svg=d.documentElement;svg.setAttribute('aria-hidden','true');svg.removeAttribute('width');svg.removeAttribute('height');icons[name]=svg.outerHTML}for(const id of ['A','B','C']){const v=document.createElement('section');v.className='variant';v.id=id;v.innerHTML=`<h2>${id} · ${descriptions[id][0]}${id==='B'?' <span class="recommend">推荐</span>':''}</h2><p class="description">${descriptions[id][1]}</p>`;v.append(document.querySelector('#screen').content.cloneNode(true));document.querySelector('#gallery').append(v);v.querySelector('[data-actions]').innerHTML=[['digest','日摘要','calendar-days'],['search','搜索文章','search'],['more','更多','ellipsis']].map(([act,label,i])=>`<button class="icon-button" data-action="${act}" aria-label="${label}">${icon(i)}</button>`).join('');v.querySelector('[data-chevron]').innerHTML=icon('chevron-down');v.querySelector('[data-system]').textContent='5G · 87%';v.querySelectorAll('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));render(id)}syncPreview();document.documentElement.dataset.ready='true'}
init().catch(e=>{document.querySelector('#gallery').textContent='原型资源未加载，请通过本地预览服务打开。'+e.message;console.error(e)});
</script>
</body></html>
